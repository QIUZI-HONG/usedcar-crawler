[project]
name = "usedcar-crawler"
version = "0.1.0"
description = "基于 Scrapling 的二手车行情数据采集平台（EV / FUEL 双业务线）"
requires-python = ">=3.10"
dependencies = [
    "scrapling[fetchers]>=0.3",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "PyYAML>=6.0",
    "SQLAlchemy>=2.0",
    "pandas>=2.2",
    "openpyxl>=3.1",
    "APScheduler>=3.10",
    "tenacity>=8.3",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]
mysql = ["PyMySQL>=1.1"]

[project.scripts]
usedcar-crawler = "usedcar_crawler.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["src/usedcar_crawler"]
omit = ["*/cli.py"]
